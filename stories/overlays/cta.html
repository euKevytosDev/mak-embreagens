<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:radial-gradient(ellipse at center,#1a120c 0%,#0a0a0a 70%);
overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px}
.eyebrow{color:#e87a1f;font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:26px;margin-bottom:22px}
h1{font-size:64px;font-weight:800;line-height:1.08;max-width:900px;margin-bottom:24px}
p{font-size:28px;color:rgba(255,255,255,.78);max-width:820px;line-height:1.4;margin-bottom:48px}
.btn{background:#e87a1f;color:#111;font-weight:800;font-size:28px;padding:22px 42px;border-radius:999px;
box-shadow:0 16px 40px rgba(232,122,31,.35)}
.hint{margin-top:28px;font-size:20px;color:rgba(255,255,255,.55)}
.arrow{font-size:42px;margin-top:18px;color:#e87a1f}
</style></head><body>
  <div class="eyebrow">Pronto para o próximo passo?</div>
  <h1>Quer um site que vende para o seu negócio?</h1>
  <p>Toque no link e faça um orçamento. Transformamos sua oficina em presença digital que gera contato.</p>
  <div class="btn">Toque no link ↓</div>
  <div class="hint">Adicione o sticker de link no Instagram</div>
  <div class="arrow">↓</div>
</body></html>
