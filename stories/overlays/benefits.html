<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:420px;height:520px;background:#0a0a0a;overflow:hidden;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
.wrap{margin:8px;padding:20px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(232,122,31,.4);
border-radius:22px}
h3{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#e87a1f;margin-bottom:18px;font-weight:800}
.item{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#e87a1f;margin-top:8px;flex-shrink:0;
box-shadow:0 0 12px rgba(232,122,31,.6)}
.txt{font-size:20px;font-weight:700;line-height:1.3}
</style></head><body>
<div class="wrap">
  <h3>O que o site entrega</h3>
  <div class="item"><div class="dot"></div><div class="txt">Design 100% responsivo</div></div>
  <div class="item"><div class="dot"></div><div class="txt">Foco em conversão (mobile-first)</div></div>
  <div class="item"><div class="dot"></div><div class="txt">WhatsApp integrado</div></div>
  <div class="item"><div class="dot"></div><div class="txt">Carregamento ultra rápido</div></div>
</div>
</body></html>
