<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:500px;height:240px;background:#0a0a0a;overflow:hidden;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.bubble{margin:12px;background:#fff;color:#111;border-radius:22px;padding:18px 20px 16px;
box-shadow:0 18px 40px rgba(0,0,0,.45);position:relative}
.bubble:after{content:"";position:absolute;left:40px;bottom:-12px;border-left:12px solid transparent;
border-right:12px solid transparent;border-top:14px solid #fff}
.stars{color:#e87a1f;letter-spacing:2px;font-size:15px;margin-bottom:6px;font-weight:700}
.quote{font-size:19px;font-weight:700;line-height:1.35}
.who{margin-top:10px;font-size:13px;color:#666;font-weight:600}
</style></head><body>
<div class="bubble">
  <div class="stars">★★★★★</div>
  <div class="quote">“Ficou sensacional! Já estamos recebendo leads pelo WhatsApp.”</div>
  <div class="who">MAK Embreagens · Contagem/MG</div>
</div>
</body></html>
