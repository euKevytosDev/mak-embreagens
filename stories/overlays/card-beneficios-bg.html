<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:1080px;height:1080px;
  background:#0a0a0a;
  overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:#fff;
  display:grid;place-items:center;
}
.wrap{
  width:720px;
  padding:52px 44px 56px;
  background:rgba(18,14,12,.95);
  border:1.5px solid rgba(232,122,31,.55);
  border-radius:36px;
  box-shadow:0 0 0 1px rgba(232,122,31,.08), 0 28px 70px rgba(0,0,0,.5);
}
h3{
  font-size:24px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#e87a1f;
  margin-bottom:40px;
  font-weight:800;
}
.item{display:flex;gap:18px;align-items:flex-start;margin-bottom:30px}
.item:last-child{margin-bottom:0}
.dot{
  width:14px;height:14px;border-radius:50%;
  background:#e87a1f;margin-top:14px;flex-shrink:0;
  box-shadow:0 0 16px rgba(232,122,31,.65);
}
.txt{font-size:36px;font-weight:700;line-height:1.3}
</style></head><body>
<div class="wrap">
  <h3>O que o site entrega</h3>
  <div class="item"><div class="dot"></div><div class="txt">Design 100% responsivo</div></div>
  <div class="item"><div class="dot"></div><div class="txt">Foco em conversão (mobile-first)</div></div>
  <div class="item"><div class="dot"></div><div class="txt">WhatsApp integrado</div></div>
  <div class="item"><div class="dot"></div><div class="txt">Carregamento ultra rápido</div></div>
</div>
</body></html>
