<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="50%" stop-color="#c4c4c4"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#8e8e8e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- lid -->
  <rect x="40" y="20" width="1320" height="820" rx="28" fill="url(#body)" filter="url(#shadow)"/>
  <!-- inner bezel -->
  <rect x="70" y="48" width="1260" height="760" rx="14" fill="#1a1a1a"/>
  <!-- notch -->
  <rect x="640" y="48" width="120" height="18" rx="6" fill="#111"/>
  <!-- screen cutout (transparent) -->
  <rect x="90" y="78" width="1220" height="700" rx="4" fill="#000" fill-opacity="0"/>
  <!-- base hinge -->
  <rect x="200" y="830" width="1000" height="28" rx="4" fill="url(#base)"/>
  <rect x="120" y="850" width="1160" height="30" rx="8" fill="#9a9a9a"/>
  <ellipse cx="700" cy="862" rx="70" ry="6" fill="#7a7a7a"/>
</svg>
